
name: Update PFF Pass Protection

on:
  workflow_dispatch:

jobs:
  update-pass-protection:
    runs-on: ubuntu-latest

    env:
      PFF_API_KEY: ${{ secrets.PFF_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Restish
        run: |
          curl -L https://github.com/rest-sh/restish/releases/download/v2.3.0/restish-2.3.0-linux-amd64.tar.gz -o restish.tar.gz
          tar -xzf restish.tar.gz
          chmod +x restish
          sudo mv restish /usr/local/bin/restish

      - name: Connect Restish to PFF
        run: |
          restish api connect pff https://api.pff.com

      - name: Configure PFF authentication
        run: |
          restish api set pff 'profiles.ci.credentials.pffApiKey.auth.type: bearer'
          restish api set pff 'profiles.ci.credentials.pffApiKey.auth.params.token: env:PFF_API_KEY'

      - name: Verify authentication
        run: |
          restish pff whoami -p ci

      - name: Build Pass Protection data
        run: |
          python scripts/pass_protection.py 2026

      - name: Verify generated JSON
        run: |
          RAW_FILE="data/pass_protection_2026_raw.json"
          PROCESSED_FILE="data/pass_protection_2026.json"

          echo "Checking raw data..."
          if [ ! -s "$RAW_FILE" ]; then
            echo "ERROR: Raw JSON missing or empty: $RAW_FILE"
            ls -lah data || true
            exit 1
          fi

          echo "Checking processed data..."
          if [ ! -s "$PROCESSED_FILE" ]; then
            echo "ERROR: Processed JSON missing or empty: $PROCESSED_FILE"
            ls -lah data || true
            exit 1
          fi

          echo ""
          echo "Generated files:"
          ls -lh "$RAW_FILE" "$PROCESSED_FILE"

          echo ""
          echo "Processed data preview:"
          head -n 80 "$PROCESSED_FILE"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pass_protection_2026_raw.json
          git add data/pass_protection_2026.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update 2026 PFF Pass Protection data"
            git push
          fi
