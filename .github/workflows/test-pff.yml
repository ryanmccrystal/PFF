      - name: Inspect time-in-pocket records
        run: |
          python - <<'PY'
          import json

          with open("time_in_pocket_week1.json") as f:
              data = json.load(f)

          rows = data["time_in_pockets"]

          print("Number of time-in-pocket records:", len(rows))
          print()

          print("First 5 records:")
          for row in rows[:5]:
              print({
                  "player": row.get("player"),
                  "player_id": row.get("player_id"),
                  "team": row.get("team"),
                  "franchise_id": row.get("franchise_id"),
                  "player_game_count": row.get("player_game_count"),
                  "less_dropbacks": row.get("less_dropbacks"),
                  "more_dropbacks": row.get("more_dropbacks"),
              })

          print()
          print("Unique franchise IDs in time-in-pocket data:")

          franchise_ids = sorted({
              row.get("franchise_id")
              for row in rows
              if row.get("franchise_id") is not None
          })

          print(franchise_ids[:100])
          print("Total:", len(franchise_ids))
          PY
