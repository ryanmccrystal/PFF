name: Test PFF Time to Throw

on:
  workflow_dispatch:

jobs:
  test-time-to-throw:
    runs-on: ubuntu-latest

    env:
      PFF_API_KEY: ${{ secrets.PFF_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Restish
        run: |
          curl -L https://github.com/rest-sh/restish/releases/download/v2.3.0/restish-2.3.0-linux-amd64.tar.gz -o restish.tar.gz
          tar -xzf restish.tar.gz
          chmod +x restish
          sudo mv restish /usr/local/bin/restish

      - name: Connect Restish to PFF
        run: |
          restish api connect pff https://api.pff.com

      - name: Configure PFF authentication
        run: |
          restish api set pff 'profiles.ci.credentials.pffApiKey.auth.type: bearer'
          restish api set pff 'profiles.ci.credentials.pffApiKey.auth.params.token: env:PFF_API_KEY'

      - name: Verify authentication
        run: |
          restish pff whoami -p ci

      - name: Get NCAA Week 1 data
        run: |
          restish pff signature-passing-time-in-pocket ncaa 2026 1 -p ci > time_in_pocket_week1.json
          restish pff ref-games ncaa 2026 1 -p ci > games_week1.json

      - name: Get NCAA Week 2 data
        run: |
          restish pff signature-passing-time-in-pocket ncaa 2026 2 -p ci > time_in_pocket_week2.json
          restish pff ref-games ncaa 2026 2 -p ci > games_week2.json

      - name: Get NCAA Week 3 data
        run: |
          restish pff signature-passing-time-in-pocket ncaa 2026 3 -p ci > time_in_pocket_week3.json
          restish pff ref-games ncaa 2026 3 -p ci > games_week3.json

      - name: Run Time to Throw aggregation
        run: |
          python scripts/time_to_throw.py

      - name: Show generated data
        run: |
          echo "Generated file:"
          ls -lh time_to_throw.json

          echo ""
          echo "First 100 lines:"
          head -n 100 time_to_throw.json

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: pff-time-to-throw-weeks-1-3
          path: time_to_throw.json
