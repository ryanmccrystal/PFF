name: Update PFF Time to Throw

on:
  workflow_dispatch:

jobs:
  update-time-to-throw:
    runs-on: ubuntu-latest

    env:
      PFF_API_KEY: ${{ secrets.PFF_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Restish
        run: |
          curl -L https://github.com/rest-sh/restish/releases/download/v2.3.0/restish-2.3.0-linux-amd64.tar.gz -o restish.tar.gz
          tar -xzf restish.tar.gz
          chmod +x restish
          sudo mv restish /usr/local/bin/restish

      - name: Connect Restish to PFF
        run: |
          restish api connect pff https://api.pff.com

      - name: Configure PFF authentication
        run: |
          restish api set pff 'profiles.ci.credentials.pffApiKey.auth.type: bearer'
          restish api set pff 'profiles.ci.credentials.pffApiKey.auth.params.token: env:PFF_API_KEY'

      - name: Verify authentication
        run: |
          restish pff whoami -p ci

      - name: Build Time to Throw data
        run: |
          echo "========================================"
          echo "BUILDING 2025"
          echo "========================================"
          python scripts/time_to_throw.py 2025

          echo ""
          echo "========================================"
          echo "BUILDING 2026"
          echo "========================================"
          python scripts/time_to_throw.py 2026

      - name: Generate team pages
        run: |
          python scripts/generate_team_pages.py

      - name: Show generated data
        run: |
          echo "========================================"
          echo "GENERATED DATA"
          echo "========================================"

          echo ""
          echo "2025 data:"
          ls -lh data/time_to_throw_2025.json

          echo ""
          echo "First 20 lines of 2025 data:"
          head -n 20 data/time_to_throw_2025.json

          echo ""
          echo "2026 data:"
          ls -lh data/time_to_throw_2026.json

          echo ""
          echo "First 20 lines of 2026 data:"
          head -n 20 data/time_to_throw_2026.json

          echo ""
          echo "========================================"
          echo "GENERATED TEAM PAGES"
          echo "========================================"

          echo ""
          echo "Number of 2026 team pages:"
          find teams -maxdepth 1 -name "*.html" | wc -l

          echo ""
          echo "2026 team pages:"
          find teams -maxdepth 1 -name "*.html" | sort

          echo ""
          echo "Number of 2025 team pages:"
          if [ -d "2025/teams" ]; then
            find 2025/teams -maxdepth 1 -name "*.html" | wc -l
          else
            echo "2025/teams does not exist yet."
          fi

          echo ""
          echo "2025 team pages:"
          if [ -d "2025/teams" ]; then
            find 2025/teams -maxdepth 1 -name "*.html" | sort
          else
            echo "2025/teams does not exist yet."
          fi

      - name: Commit updated data and team pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/time_to_throw_2025.json
          git add data/time_to_throw_2026.json
          git add teams/
          git add 2025/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update PFF Time to Throw data"
            git push
          fi
