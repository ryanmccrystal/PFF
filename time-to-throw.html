<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Time to Throw | PFF</title>

<style>
    body {
        font-family: "Times New Roman", Times, serif;
        background: #ffffff;
        color: #111111;
        margin: 0;
        padding: 30px 15px;
    }

    .container {
        max-width: 1100px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin: 0;
        font-size: 32px;
    }

    .subtitle {
        text-align: center;
        margin-top: 5px;
        margin-bottom: 20px;
        font-size: 16px;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 15px;
    }

    .toggle {
        font-family: "Times New Roman", Times, serif;
        font-size: 15px;
        padding: 7px 16px;
        border: 1px solid #222;
        background: #ffffff;
        color: #111111;
        cursor: pointer;
    }

    .toggle.active {
        background: #111111;
        color: #ffffff;
    }

    .season-info {
        text-align: center;
        font-size: 14px;
        margin-bottom: 12px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
    }

    th {
        border-top: 2px solid #111111;
        border-bottom: 1px solid #111111;
        padding: 7px 6px;
        text-align: center;
        white-space: nowrap;
    }

    td {
        padding: 6px;
        border-bottom: 1px solid #dddddd;
        text-align: center;
        white-space: nowrap;
    }

    th:first-child,
    td:first-child {
        text-align: left;
    }

    tbody tr:last-child td {
        border-bottom: 2px solid #111111;
    }

    .rank {
        display: inline-block;
        width: 28px;
        text-align: right;
        margin-right: 5px;
    }

    .team {
        font-weight: bold;
    }

    .loading,
    .error {
        text-align: center;
        margin-top: 30px;
        font-size: 16px;
    }

    @media (max-width: 700px) {
        body {
            padding: 20px 8px;
        }

        h1 {
            font-size: 26px;
        }

        table {
            font-size: 13px;
        }

        th,
        td {
            padding: 5px 4px;
        }

        .rank {
            width: 22px;
            margin-right: 2px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Time to Throw</h1>

    <div class="subtitle">
        Opposing quarterback performance by time to throw
    </div>

    <div class="controls">
        <button id="lessButton" class="toggle active">
            &lt; 2.5 sec
        </button>

        <button id="moreButton" class="toggle">
            2.5+ sec
        </button>
    </div>

    <div id="seasonInfo" class="season-info">
        Loading...
    </div>

    <div id="tableContainer">
        <div class="loading">Loading Time to Throw data...</div>
    </div>

</div>

<script>

let data = null;
let currentMode = "less_2_5";


function formatNumber(value) {
    return Number(value).toLocaleString("en-US");
}


function formatPercent(value) {
    return Number(value).toFixed(1) + "%";
}


function formatYPA(value) {
    return Number(value).toFixed(1);
}


function renderTable() {

    if (!data || !data.teams) {
        return;
    }

    const teams = [...data.teams];

    /*
     * Sort by dropbacks, highest to lowest.
     */
    teams.sort((a, b) => {
        return b[currentMode].dropbacks - a[currentMode].dropbacks;
    });

    let html = `
        <table>
            <thead>
                <tr>
                    <th>Defense</th>
                    <th>Dropbacks</th>
                    <th>Comp%</th>
                    <th>Yds/Att</th>
                    <th>TD</th>
                    <th>INT</th>
                    <th>Sacks</th>
                    <th>Pressure%</th>
                </tr>
            </thead>
            <tbody>
    `;

    teams.forEach((team, index) => {

        const stats = team[currentMode];

        html += `
            <tr>
                <td>
                    <span class="rank">${index + 1}.</span>
                    <span class="team">${team.team_name}</span>
                </td>

                <td>${formatNumber(stats.dropbacks)}</td>

                <td>${formatPercent(stats.comp_pct)}</td>

                <td>${formatYPA(stats.ypa)}</td>

                <td>${formatNumber(stats.td)}</td>

                <td>${formatNumber(stats.int)}</td>

                <td>${formatNumber(stats.sacks)}</td>

                <td>${formatPercent(stats.pressure_pct)}</td>
            </tr>
        `;
    });

    html += `
            </tbody>
        </table>
    `;

    document.getElementById("tableContainer").innerHTML = html;
}


function updateButtons() {

    const lessButton = document.getElementById("lessButton");
    const moreButton = document.getElementById("moreButton");

    lessButton.classList.toggle(
        "active",
        currentMode === "less_2_5"
    );

    moreButton.classList.toggle(
        "active",
        currentMode === "more_2_5"
    );
}


document.getElementById("lessButton").addEventListener(
    "click",
    function() {

        currentMode = "less_2_5";

        updateButtons();
        renderTable();
    }
);


document.getElementById("moreButton").addEventListener(
    "click",
    function() {

        currentMode = "more_2_5";

        updateButtons();
        renderTable();
    }
);


fetch("data/time_to_throw.json")
    .then(response => {

        if (!response.ok) {
            throw new Error(
                "Unable to load Time to Throw data."
            );
        }

        return response.json();
    })
    .then(json => {

        data = json;

        const weeks = json.weeks_processed || [];

        let weekText = "";

        if (weeks.length === 1) {
            weekText = `Week ${weeks[0]}`;
        }
        else if (weeks.length > 1) {
            weekText =
                `Weeks ${weeks[0]}–${weeks[weeks.length - 1]}`;
        }
        else {
            weekText = "No weeks available";
        }

        document.getElementById("seasonInfo").textContent =
            `${json.season} • ${weekText} • FBS vs FBS`;

        updateButtons();
        renderTable();
    })
    .catch(error => {

        console.error(error);

        document.getElementById("tableContainer").innerHTML = `
            <div class="error">
                Unable to load Time to Throw data.
            </div>
        `;
    });

</script>

</body>
</html>
